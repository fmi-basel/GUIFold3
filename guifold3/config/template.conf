[QUEUE]
# Example for slurm
queue_submit = sbatch
queue_cancel = scancel
min_cpus = 20
max_cpus = 80
min_ram = 100
max_ram = 800
max_gpu_mem = 80
queue_default = True
split_job = True
queue_jobid_regex = \D*(\d+)\D

[DATABASES]
# Path to AF3 model weights
model_dir = /path/to/model
# Path to directory with all required databases for AF3
db_dir = /path/to/databases

[BINARIES]
jackhmmer_binary_path = /path/to/conda_env/bin/jackhmmer
hmmsearch_binary_path = /path/to/conda_env/bin/hmmsearch
hmmbuild_binary_path = //path/to/conda_env/bin/hmmbuild
hmmalign_binary_path = /path/to/conda_env/bin/hmmalign
nhmmer_binary_path = /path/to/conda_env/bin/nhmmer

[OTHER]
global_config = True
jax_compilation_cache_dir = /path/to/temp
use_gpu_relax = True
lock_settings = False
update_from_global_config = True
force_update = False