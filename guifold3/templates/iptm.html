<a name="iptm">
    <h2>ipTM score</h2>
    <p>The table below lists for each predicted model the interface predicted template modelling score (ipTM, 0-1).</p>

    <table border = "1">
        {% for name, iptm in iptm_by_model_dict.items() %}
        {% if loop.index == 1 %}
        <tr>
            <th>Model number</th>
            <th>ipTM</th>
        </tr>
        {% endif %}

        <tr id="plddt-table-{{loop.index}}">
            <td>{{name}}</td>
            <td>{{'%0.2f'| format(iptm|float)}}</td>
        </tr>
        {% endfor %}
    </table>
