<a name="ptm">
    <h2>pTM</h2>
    <p>The table below lists for each predicted model the predicted template modelling score (pTM, 0-1).</p>

    <table border = "1">
        {% for name, ptm in ptm_by_model_dict.items() %}
        {% if loop.index == 1 %}
        <tr>
            <th>Model number</th>
            <th>pTM</th>
        </tr>
        {% endif %}

        <tr id="ptm-table-{{loop.index}}">
            <td>{{name}}</td>
            <td>{{'%0.2f'| format(ptm|float)}}</td>
        </tr>
        {% endfor %}
    </table>
