[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guifold3"
version = "0.1.0"
authors = [{ name = "Georg Kempf", email = "georg.kempf@fmi.ch" }]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
        "pandas",
        "numpy",
        "SQLAlchemy==1.3.19",
        "PyQt5==5.15.4",
        "Jinja2",
        "biopython==1.88",
        "PyQtWebEngine",
        "nvidia-ml-py3==7.352.0",
        "plotly"
        ]

[project.scripts]
afgui = "guifold3.afgui:main"
af3eval = "guifold3.af3eval:main"
adjust_json = "guifold3.adjust_json:main"
